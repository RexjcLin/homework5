<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct"
        crossorigin="anonymous"></script>
    <title>新增溫溼度顯示</title>
</head>

<body>
    <div class="head container text-center">
        <h1>新增溫溼度顯示</h1>
        <h3><a href="{% url 'view_history_temperature' %}">歷史溫溼度顯示</a></h3>
    </div>
    <div class="container">
        <form method="post" action="{% url 'add_temperature' %}">
            {% csrf_token %}
            <div class="form-group row">
                <div class="col-sm-2"></div>
                <label for="sensor_id" class="col-sm-2 col-form-label">Sensor ID</label>
                <div class="col-sm-6">
                    <input type="text" class="form-control" id="sensor_id" name="sensor_id" required>
                </div>
                <div class="col-sm-2"></div>
            </div>
            <div class="form-group row">
                <div class="col-sm-2"></div>
                <label for="temperature" class="col-sm-2 col-form-label">溫度</label>
                <div class="col-sm-6">
                    <input type="number" step="0.01" class="form-control" id="temperature" name="temperature" required>
                </div>
                <div class="col-sm-2"></div>
            </div>
            <div class="form-group row">
                <div class="col-sm-2"></div>
                <label for="humidity" class="col-sm-2 col-form-label">濕度</label>
                <div class="col-sm-6">
                    <input type="number" step="0.01" class="form-control" id="humidity" name="humidity" required>
                </div>
                <div class="col-sm-2"></div>
            </div>
            <!-- 提交按鈕靠近表單右下 -->
            <div class="form-group row">
                <div class="col-sm-8"></div>
                <div class="col-sm-2">
                    <button type="submit" class="btn btn-primary float-right">Submit</button>
                </div>
                <div class="col-sm-2"></div>
            </div>
        </form>
    </div>
</body>

</html>
