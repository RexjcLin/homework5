<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    
    <title>即時溫溼度顯示</title>
    <!-- <meta http-equiv="refresh" content="10"> -->
    <style>
        .fnav{
            text-align: center;
        }
        .panel_time p {
            font-size: 1.2em;
            font-weight: bold;
        }

    </style>
    <script>
        $(function () {
            console.log("Document is ready");
            refresh();
            //setInterval(refresh, 10000);
            setInterval(updatePanelTime, 1000);
        });
        function refresh() {
            console.log("Data refreshed");
            $.get("/show_temperature_API", function(data) {
                console.log("Data received:", data);
                if (data.status === "success" && data.data.length > 0) {
                    const latest = data.data[0];
                    $("#temperature").val(latest.temperature);
                    $("#humidity").val(latest.humidity);
                }
            });
        }
        function updatePanelTime() {
            //倒數10秒
            const panel = $(".panel_time p");
            let current = parseInt(panel.text());
            if (current <= 1) {
                refresh();
                current = 10;
            } else {
                current -= 1
            }
            panel.text(current + "秒後更新");
        }
        
    </script>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center mt-4">
            <h3>目前溫濕度</h3>
        </div>
        <div class="row justify-content-center mt-4">
            <div class="col-md-2" id="temperature_title">
                <label for="temperature_title">目前溫度</label>
            </div>
            <div class="col-md-2">
                <input type="text" id="temperature" disabled>
            </div>
        </div>
        <div class="row justify-content-center mt-4">
            <div class="col-md-2" id="humidity_title">
                <label for="humidity_title">目前濕度</label>
            </div>
            <div class="col-md-2">
                <input type="text" id="humidity" disabled>
            </div>
        </div>
        <div class="row justify-content-center mt-4">
            <div class="col-md-4 panel_time">
                <p>10秒後更新</p>
            </div>
        </div>

        <nav id="footer" >
            <div class="container mt-4">
                <div class="fnav">
                    <p>Copyring @2024 <a href="">tony yeh</a> ALL rights reserved.</p>
                </div>
            </div>
        </nav>
    </div>
</body>
</html>
